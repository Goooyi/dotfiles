# 1. Turn on clipboard support
set -s set-clipboard on
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys,clipboard'
set -as terminal-features ',tmux*:clipboard'
set -as terminal-features ',screen*:clipboard'
set -as terminal-features ',ghostty*:clipboard'


# opensessions
# set -g @plugin 'Ataraxy-Labs/opensessions'

#scroling speed
set -g @scroll-speed-num-lines-per-scroll 0.5

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
# Avoid accidental copy-mode on tiny drags; use Shift+Drag to select/copy.
unbind -n MouseDrag1Pane
bind -n MouseDrag1Pane send-keys -M
bind -n S-MouseDrag1Pane copy-mode -M


# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# This need to be set before tmux-sensible, see issue: https://github.com/tmux-plugins/tmux-sensible/issues/73
set-option -s escape-time 10

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# a lot issue with this plugin, see the repo issue, disable it if needed
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Stay in copy mode after mouse selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
